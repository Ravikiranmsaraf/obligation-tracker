name: obligation-tracker-blue
services:
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: obligation-backend-blue
    restart: always
    ports:
      - "3001:3000"
    networks:
      blue-net:
        aliases:
          - backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - APP_COLOR=blue
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEPLOY_COLOR=${DEPLOY_COLOR:-unknown}

  frontend-blue:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: obligation-frontend-blue
    restart: always
    ports:
      - "8081:80"
    networks:
      - blue-net
    depends_on:
      - backend-blue

networks:
  blue-net: