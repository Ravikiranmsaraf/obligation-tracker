version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obligation-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - obligation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obligation-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://your-vm-ip:3000
    depends_on:
      - backend
    networks:
      - obligation-network

networks:
  obligation-network:
    driver: bridge