services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: obligation-backend
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: obligation-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped